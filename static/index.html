<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precision CRAG Agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
      color: var(--accent);
    }
    p.subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .answer-text {
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Precision CRAG Agent</h1>
      <p class="subtitle">Ask questions against the knowledge graph with autonomous correction.</p>
    </div>

    <form class="input-group" id="queryForm">
      <input type="text" id="questionInput" placeholder="Enter your question here..." required />
      <button type="submit" id="submitBtn">Ask</button>
    </form>

    <div id="resultCard" class="card hidden">
      <div class="meta">
        <span id="metaChunks">Chunks: -</span>
        <span id="metaQuery">Query Used: -</span>
      </div>
      <div class="answer-text" id="answerOutput"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("queryForm");
    const input = document.getElementById("questionInput");
    const button = document.getElementById("submitBtn");
    const resultCard = document.getElementById("resultCard");
    const answerOutput = document.getElementById("answerOutput");
    const metaChunks = document.getElementById("metaChunks");
    const metaQuery = document.getElementById("metaQuery");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      button.disabled = true;
      button.innerText = "Thinking...";
      resultCard.classList.remove("hidden");
      answerOutput.innerText = "Generating answer...";
      metaChunks.innerText = "Chunks: -";
      metaQuery.innerText = "Query Used: -";

      try {
        const res = await fetch("/api/v1/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        if (!res.ok) throw new Error(`Error: ${res.status}`);
        const data = await res.json();

        answerOutput.innerText = data.answer;
        metaChunks.innerText = `Retrieved Chunks: ${data.retrieved_chunks ?? 0}`;
        metaQuery.innerText = `Query: ${data.query_used ?? question}`;
      } catch (err) {
        answerOutput.innerText = "Failed to fetch response. Please try again.";
      } finally {
        button.disabled = false;
        button.innerText = "Ask";
      }
    });
  </script>
</body>
</html>
